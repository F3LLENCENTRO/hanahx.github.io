<title>Hanahx - Whack a Mole</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(
            to bottom,
            #9ed9ff 0%,
            #c8ebff 42%,
            #91c878 43%,
            #5f994d 100%
        );
        height: 100vh;
        user-select: none;
    }

    /* =========================
       TOP BAR
    ========================= */

    .home-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 68px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 35px;

        background: rgba(25, 32, 45, 0.82);
        border-bottom: 1px solid rgba(255, 255, 255, 0.18);

        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);

        z-index: 200;

        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .home-logo {
        color: white;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 2px;
        text-decoration: none;
    }

    .top-controls {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .home-link {
        display: flex;
        align-items: center;
        gap: 9px;

        padding: 10px 18px;

        border-radius: 10px;

        color: white;
        text-decoration: none;

        font-size: 14px;
        font-weight: bold;

        background: rgba(255, 255, 255, 0.1);

        transition:
            background 0.2s ease,
            transform 0.2s ease;
    }

    .home-link:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: translateY(-2px);
    }

    .home-icon {
        font-size: 18px;
    }

    /* START BUTTON */

    #startButton {
        border: none;

        padding: 10px 18px;

        border-radius: 10px;

        background: #ff78b5;
        color: white;

        font-size: 13px;
        font-weight: 900;

        cursor: pointer;

        box-shadow:
            0 4px 0 #c84c83,
            0 6px 12px rgba(0, 0, 0, 0.2);

        transition:
            transform 0.15s ease,
            background 0.15s ease;
    }

    #startButton:hover {
        background: #ff8fc4;
        transform: translateY(-2px);
    }

    #startButton:active {
        transform: translateY(3px);

        box-shadow:
            0 1px 0 #c84c83;
    }

    /* =========================
       SKY
    ========================= */

    .sky {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
    }

    .sun {
        position: absolute;

        width: 110px;
        height: 110px;

        right: 11%;
        top: 12%;

        border-radius: 50%;

        background: #fff4ba;

        box-shadow:
            0 0 60px rgba(255, 244, 186, 0.7);
    }

    /* =========================
       CHERRY BLOSSOM TREES
    ========================= */

    .tree {
        position: absolute;

        bottom: 30%;

        width: 270px;
        height: 430px;
    }

    .tree-left {
        left: -45px;
    }

    .tree-right {
        right: -45px;
        transform: scaleX(-1);
    }

    .trunk {
        position: absolute;

        bottom: 0;
        left: 50%;

        width: 48px;
        height: 310px;

        background: linear-gradient(
            90deg,
            #4b2d25,
            #75483a,
            #3e2823
        );

        border-radius: 40px 40px 10px 10px;

        transform:
            translateX(-50%)
            rotate(2deg);
    }

    .branch {
        position: absolute;

        height: 24px;

        background: #4c3028;

        border-radius: 30px;

        transform-origin: left center;
    }

    .branch.one {
        width: 180px;
        left: 47%;
        top: 130px;
        transform: rotate(-35deg);
    }

    .branch.two {
        width: 150px;
        left: 48%;
        top: 180px;
        transform: rotate(34deg);
    }

    .branch.three {
        width: 125px;
        left: 48%;
        top: 80px;
        transform: rotate(25deg);
    }

    .blossom {
        position: absolute;

        width: 90px;
        height: 90px;

        border-radius: 50%;

        background:
            radial-gradient(
                circle at 35% 30%,
                #ffdff0 0 12%,
                transparent 13%
            ),
            radial-gradient(
                circle at 65% 30%,
                #ffc4df 0 15%,
                transparent 16%
            ),
            radial-gradient(
                circle at 50% 65%,
                #ffb5d8 0 17%,
                transparent 18%
            ),
            #f38bb8;

        box-shadow:
            0 5px 20px rgba(255, 105, 170, 0.25);
    }

    .b1 {
        left: 10px;
        top: 35px;
    }

    .b2 {
        left: 75px;
        top: 10px;
        transform: scale(1.15);
    }

    .b3 {
        left: 145px;
        top: 65px;
        transform: scale(0.9);
    }

    .b4 {
        left: 105px;
        top: 115px;
        transform: scale(1.1);
    }

    .b5 {
        left: 5px;
        top: 125px;
        transform: scale(0.85);
    }

    .b6 {
        left: 160px;
        top: 135px;
        transform: scale(0.8);
    }

    /* =========================
       GRASS
    ========================= */

    .grass {
        position: fixed;

        bottom: 0;
        left: 0;

        width: 100%;
        height: 31%;

        background:
            linear-gradient(
                to bottom,
                #79b85e,
                #477b3d
            );

        z-index: 2;
    }

    .grass::before {
        content: "";

        position: absolute;
        inset: 0;

        opacity: 0.25;

        background-image:
            repeating-linear-gradient(
                110deg,
                transparent 0 8px,
                #356b31 9px 11px
            );
    }

    /* =========================
       GAME AREA
    ========================= */

    .game-wrapper {
        position: absolute;

        z-index: 10;

        left: 50%;
        top: 50%;

        transform:
            translate(-50%, -42%);

        width: min(850px, 90vw);

        text-align: center;
    }

    .title {
        color: white;

        font-size: clamp(32px, 5vw, 62px);

        font-weight: 900;

        letter-spacing: 3px;

        text-shadow:
            0 4px 0 #5b3025,
            0 7px 15px rgba(0, 0, 0, 0.3);

        margin-bottom: 5px;
    }

    .subtitle {
        color: white;

        font-size: 15px;

        font-weight: bold;

        margin-bottom: 18px;

        text-shadow:
            0 2px 4px rgba(0, 0, 0, 0.4);
    }

    /* =========================
       SCOREBOARD
    ========================= */

    .scoreboard {
        display: flex;

        justify-content: center;

        gap: 12px;

        margin-bottom: 15px;
    }

    .score-box {
        min-width: 125px;

        padding: 9px 18px;

        border-radius: 14px;

        background: rgba(45, 28, 23, 0.88);

        border: 3px solid rgba(255, 255, 255, 0.25);

        color: white;

        box-shadow:
            0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .score-label {
        display: block;

        font-size: 11px;

        opacity: 0.7;

        text-transform: uppercase;

        letter-spacing: 2px;
    }

    .score-value {
        display: block;

        font-size: 27px;

        font-weight: 900;
    }

    /* =========================
       STONE WALL
    ========================= */

    .wall {
        position: relative;

        width: 100%;

        padding: 27px;

        border-radius: 22px;

        background:
            linear-gradient(
                135deg,
                #858585,
                #676767
            );

        border: 7px solid #4b4b4b;

        box-shadow:
            0 18px 30px rgba(0, 0, 0, 0.4),
            inset 0 0 30px rgba(0, 0, 0, 0.25);
    }

    .wall::before {
        content: "";

        position: absolute;

        inset: 0;

        border-radius: 15px;

        opacity: 0.35;

        background:
            repeating-linear-gradient(
                0deg,
                transparent 0 45px,
                #444 46px 50px
            ),
            repeating-linear-gradient(
                90deg,
                transparent 0 90px,
                #4a4a4a 91px 96px
            );

        pointer-events: none;
    }

    .holes {
        position: relative;

        z-index: 2;

        display: grid;

        grid-template-columns:
            repeat(3, 1fr);

        gap: 25px;
    }

    .hole {
        position: relative;

        height: 145px;

        border-radius: 50%;

        overflow: hidden;

        cursor: pointer;

        background:
            radial-gradient(
                ellipse at center,
                #151515 0%,
                #252525 55%,
                #111 100%
            );

        border: 7px solid #505050;

        box-shadow:
            inset 0 15px 20px rgba(0, 0, 0, 0.8),
            0 5px 8px rgba(255, 255, 255, 0.12);

        transition:
            transform 0.12s ease;
    }

    .hole:hover {
        transform: scale(1.025);
    }

    /* =========================
       MOLE
    ========================= */

    .mole {
        position: absolute;

        left: 50%;
        bottom: -115px;

        width: 100px;
        height: 100px;

        transform: translateX(-50%);

        border-radius: 50%;

        object-fit: cover;

        border: 5px solid white;

        box-shadow:
            0 5px 15px rgba(0, 0, 0, 0.5);

        transition:
            bottom 0.18s cubic-bezier(.2, .8, .2, 1),
            transform 0.1s ease;

        /* Completely disable image dragging */
        user-select: none;
        -webkit-user-select: none;
        -webkit-user-drag: none;

        /* Mouse clicks go to the hole instead */
        pointer-events: none;
    }

    .hole.active .mole {
        bottom: 8px;
    }

    .hole.hit .mole {
        transform:
            translateX(-50%)
            scale(0.8)
            rotate(-12deg);

        filter: brightness(1.25);
    }

    /* =========================
       HIT TEXT
    ========================= */

    .hit-text {
        position: fixed;

        z-index: 100;

        pointer-events: none;

        color: white;

        font-size: 25px;

        font-weight: 900;

        text-shadow:
            0 3px 5px rgba(0, 0, 0, 0.5);

        animation:
            hitFloat 0.65s ease forwards;
    }

    @keyframes hitFloat {

        0% {
            opacity: 1;

            transform:
                translateY(0)
                scale(1);
        }

        100% {
            opacity: 0;

            transform:
                translateY(-65px)
                scale(1.3);
        }

    }

    /* =========================
       CHERRY PETALS
    ========================= */

    .petal {
        position: fixed;

        z-index: 20;

        width: 12px;
        height: 18px;

        border-radius:
            70% 30% 70% 30%;

        background: #ffb5d5;

        pointer-events: none;

        animation:
            fall linear forwards;
    }

    @keyframes fall {

        from {
            transform:
                translateY(-30px)
                rotate(0deg);
        }

        to {
            transform:
                translateY(110vh)
                rotate(720deg);
        }

    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 650px) {

        .home-bar {
            padding: 0 18px;
        }

        .home-logo {
            font-size: 17px;
        }

        .top-controls {
            gap: 7px;
        }

        #startButton {
            padding: 9px 12px;
            font-size: 11px;
        }

        .home-link {
            padding: 9px 12px;
        }

        .game-wrapper {
            width: 94vw;
        }

        .wall {
            padding: 15px;
        }

        .holes {
            gap: 12px;
        }

        .hole {
            height: 105px;
        }

        .mole {
            width: 75px;
            height: 75px;
        }

        .tree {
            transform: scale(0.7);
            transform-origin: bottom;
        }

        .tree-right {
            transform:
                scaleX(-1)
                scale(0.7);
        }
    }

</style>

            </span>

<script>

    const holes =
        document.querySelectorAll(".hole");

    const scoreDisplay =
        document.getElementById("score");

    const timeDisplay =
        document.getElementById("time");

    const startButton =
        document.getElementById("startButton");


    let score = 0;
    let time = 30;

    let gameRunning = false;

    let moleTimer = null;
    let countdownTimer = null;

    let activeHole = null;


    /* =========================
       RANDOM HOLE
    ========================= */

    function randomHole() {

        return holes[
            Math.floor(
                Math.random() * holes.length
            )
        ];

    }


    /* =========================
       SHOW MOLE
    ========================= */

    function showMole() {

        if (!gameRunning) {
            return;
        }

        if (activeHole) {
            activeHole.classList.remove("active");
            activeHole.classList.remove("hit");
        }

        activeHole = randomHole();

        activeHole.classList.remove("hit");

        activeHole.classList.add("active");


        /*
            MOLE STAYS UP FOR
            EXACTLY 0.7 SECONDS
        */

        moleTimer = setTimeout(() => {

            if (!gameRunning) {
                return;
            }

            if (activeHole) {
                activeHole.classList.remove("active");
            }

            showMole();

        }, 700);

    }


    /* =========================
       HIT MOLE
    ========================= */

    function hitMole(event, hole) {

        if (!gameRunning) {
            return;
        }

        if (!hole.classList.contains("active")) {
            return;
        }

        score++;

        scoreDisplay.textContent =
            score;


        hole.classList.add("hit");

        hole.classList.remove("active");


        createHitText(
            event.clientX,
            event.clientY
        );


        clearTimeout(moleTimer);


        setTimeout(() => {

            hole.classList.remove("hit");

        }, 120);


        /*
            Immediately choose
            another mole.
        */

        setTimeout(() => {

            if (gameRunning) {
                showMole();
            }

        }, 80);

    }


    /* =========================
       +1 EFFECT
    ========================= */

    function createHitText(x, y) {

        const text =
            document.createElement("div");

        text.className =
            "hit-text";

        text.textContent =
            "+1";

        text.style.left =
            `${x}px`;

        text.style.top =
            `${y}px`;


        document.body.appendChild(text);


        setTimeout(() => {

            text.remove();

        }, 700);

    }


    /* =========================
       START GAME
    ========================= */

    function startGame() {

        clearTimeout(moleTimer);

        clearInterval(countdownTimer);


        score = 0;
        time = 30;


        scoreDisplay.textContent =
            score;

        timeDisplay.textContent =
            time;


        gameRunning = true;


        startButton.textContent =
            "RESTART GAME";


        holes.forEach(hole => {

            hole.classList.remove(
                "active",
                "hit"
            );

        });


        showMole();


        countdownTimer =
            setInterval(() => {

                time--;

                timeDisplay.textContent =
                    time;


                if (time <= 0) {
                    endGame();
                }

            }, 1000);

    }


    /* =========================
       END GAME
    ========================= */

    function endGame() {

        gameRunning = false;


        clearTimeout(moleTimer);

        clearInterval(
            countdownTimer
        );


        holes.forEach(hole => {

            hole.classList.remove(
                "active",
                "hit"
            );

        });


        startButton.textContent =
            "PLAY AGAIN";

    }


    /* =========================
       HOLE CLICKING
    ========================= */

    holes.forEach(hole => {

        hole.addEventListener(
            "click",
            function(event) {

                hitMole(
                    event,
                    hole
                );

            }
        );

    });


    /* START BUTTON */

    startButton.addEventListener(
        "click",
        startGame
    );


    /* =========================
       PREVENT IMAGE DRAGGING
    ========================= */

    document
        .querySelectorAll("img")
        .forEach(image => {

            image.addEventListener(
                "dragstart",
                function(event) {

                    event.preventDefault();

                }
            );

        });


    /* =========================
       CHERRY BLOSSOM PETALS
    ========================= */

    function createPetal() {

        const petal =
            document.createElement("div");

        petal.className =
            "petal";


        petal.style.left =
            Math.random() * 100 + "vw";

        petal.style.top =
            "-30px";


        petal.style.animationDuration =
            (5 + Math.random() * 6) + "s";


        petal.style.opacity =
            0.55 + Math.random() * 0.45;


        petal.style.transform =
            `rotate(${Math.random() * 360}deg)`;


        document.body.appendChild(
            petal
        );


        setTimeout(() => {

            petal.remove();

        }, 12000);

    }


    setInterval(
        createPetal,
        450
    );

</script>
